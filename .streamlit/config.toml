# Tema da Plataforma IP.
#
# Por que este arquivo existe: localmente o app é iniciado com `--theme.base` via
# `iniciar_app.bat`, mas o Streamlit Cloud não recebe argumentos de CLI. Sem esta
# configuração, o app publicado renderiza os componentes num tema enquanto o CSS de
# app.py pinta o fundo de outro — o resultado é um híbrido ilegível. As cores abaixo
# são as mesmas que app.py já injeta, então isto apenas replica no deploy o
# comportamento que já existe localmente.
#
# Paleta clara adotada em 08/09/2026, a pedido — decisão de marca, não default do
# Streamlit. Fundo/superfícies vieram de #0b111e/#12192b (quase-preto) para
# #F4F6FA/#FFFFFF; texto de #f8fafc para #1B2434. Teal (`primaryColor`) e o navy de
# marca (usado pontualmente no CSS de app.py) não mudaram — são a identidade, o que
# mudou foi só a hierarquia de superfície ao redor deles.

[theme]
base = "light"
backgroundColor = "#F4F6FA"
textColor = "#1B2434"

# Superfície dos campos editáveis (o Streamlit usa `secondaryBackgroundColor` como
# preenchimento de input, select, textarea e number_input, e também pinta a sidebar e
# containers como `st.expander`). Branco puro, para destacar do cinza-azulado do fundo
# só pela borda — mesma lógica de contraste do tema escuro anterior, invertida.
secondaryBackgroundColor = "#FFFFFF"

# `showWidgetBorder` desenha o contorno em todo widget de entrada da plataforma, o que
# antes era remendado caso a caso (a tela de login tinha o próprio CSS só para isso).
showWidgetBorder = true
borderColor = "#CBD5E1"

# `primaryColor` é o teal da identidade — mantido do tema escuro, não é ajustável aqui.
primaryColor = "#00A9E0"
# `linkColor` NÃO é o mesmo teal do botão: teal #00A9E0 como texto puro sobre fundo
# claro fica abaixo do contraste mínimo de leitura (funciona em botão preenchido com
# texto branco, que é outra conta de contraste). Versão escurecida do mesmo tom, ainda
# reconhecível como "a cor da marca", mas legível como texto corrido.
linkColor = "#0B84AE"

baseRadius = "0.6rem"
buttonRadius = "0.5rem"

[server]
# planilhas de cadastro e BDGD passam folgadamente de 200 MB no upload
maxUploadSize = 400
